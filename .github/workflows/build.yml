name: Build signed APK

on:
  push:
    branches: ["main", "master", "feature/settings-ui"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > keystore.jks

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Psigning.keyPath=${{ github.workspace }}/keystore.jks \
            -Psigning.storePassword=${{ secrets.KEYSTORE_PASSWORD }} \
            -Psigning.keyAlias=${{ secrets.KEY_ALIAS }} \
            -Psigning.keyPassword=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: custom-tts-signed
          path: app/build/outputs/apk/release/app-release.apk
